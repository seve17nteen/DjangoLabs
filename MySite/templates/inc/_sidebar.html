{% load news_tags %}

<!-- СПИСОК КАТЕГОРИЙ -->
<div class="list-group">
    {% get_list_categories as categories %}
    {% for item in categories %}
        <a href="{% url 'news:category' item.pk %}"
           class="list-group-item list-group-item-action">
           {{ item.title }}
        </a>
    {% endfor %}
</div>

<br>

<!-- ТОП-10 ПОПУЛЯРНЫХ НОВОСТЕЙ (ЗАДАНИЕ 3) -->
<div class="list-group">
    <div class="list-group-item list-group-item-secondary">
        🔥 Топ-10 популярных новостей
    </div>
    {% for news in popular_news %}
        <a href="{{ news.get_absolute_url }}"
           class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            {{ news.title }}
            <span class="badge bg-primary rounded-pill">{{ news.views }}</span>
        </a>
    {% empty %}
        <div class="list-group-item text-muted">
            Нет популярных новостей
        </div>
    {% endfor %}
</div>

<br>

<!-- ПОСЛЕДНИЕ НОВОСТИ ПО КАТЕГОРИЯМ -->
{% show_categories %}
